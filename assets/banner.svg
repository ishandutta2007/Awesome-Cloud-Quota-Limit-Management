<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0B0F19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070A10"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1F2937" stop-opacity=".7"/><stop offset="100%" stop-color="#111827" stop-opacity=".8"/></linearGradient><linearGradient id="primaryTextGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60A5FA"/><stop offset="50%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#F472B6"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient><linearGradient id="accentOrange" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#EF4444"/></linearGradient><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glowText" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#374151" stroke-opacity=".3" stroke-width=".5" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-15px) translateX(10px);opacity:.7}}@keyframes fillGauge{0%{stroke-dasharray:0 283}50%{stroke-dasharray:210 283}}.badge-text,.metric-label,.metric-value,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:url(#primaryTextGrad);letter-spacing:-.5px}.subtitle{font-weight:500;font-size:18px;fill:#9ca3af}.badge-text{font-weight:600;font-size:13px;fill:#e5e7eb}.metric-value{font-weight:700;font-size:20px;fill:#f3f4f6}.metric-label{font-weight:500;font-size:12px;fill:#9ca3af}.pulsing-bg{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.particle-1{animation:floatParticle 8s ease-in-out infinite}.particle-2{animation:floatParticle 10s ease-in-out infinite 2s}.particle-3{animation:floatParticle 7s ease-in-out infinite 4s}.animated-line{stroke-dasharray:8 8;animation:dashCycle 2s linear infinite}.gauge-progress{stroke-dasharray:220 283;transition:stroke-dasharray 1s ease}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g id="background-dynamic-elements"><circle cx="150" cy="80" r="180" fill="#3B82F6" class="pulsing-bg" filter="blur(40px)" opacity=".15"/><circle cx="1050" cy="280" r="160" fill="#8B5CF6" class="pulsing-bg" filter="blur(40px)" opacity=".15"/><circle cx="900" cy="70" r="130" fill="#EC4899" class="pulsing-bg" filter="blur(35px)" opacity=".1"/><path fill="none" stroke="#374151" stroke-width="1.5" d="M 50 300 Q 250 220 450 280 T 850 240 T 1150 290" opacity=".5"/><path fill="none" stroke="url(#accentCyan)" stroke-width="2" d="M 50 300 Q 250 220 450 280 T 850 240 T 1150 290" class="animated-line" opacity=".6"/><path fill="none" stroke="#374151" stroke-width="1.5" d="M 100 80 Q 350 150 650 90 T 1100 130" opacity=".3"/><path fill="none" stroke="url(#primaryTextGrad)" stroke-width="1.5" d="M 100 80 Q 350 150 650 90 T 1100 130" class="animated-line" opacity=".4"/><circle cx="220" cy="120" r="3" fill="#60A5FA" class="particle-1"/><circle cx="450" cy="70" r="4" fill="#A78BFA" class="particle-2"/><circle cx="780" cy="110" r="3" fill="#F472B6" class="particle-3"/><circle cx="98