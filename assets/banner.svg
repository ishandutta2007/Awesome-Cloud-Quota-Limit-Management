<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="bar-grad-1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bar-grad-2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bar-grad-3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatParticle {
        0% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-15px) scale(1.1); opacity: 0.7; }
        100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes barGrow {
        0% { transform: scaleY(0.6); }
        50% { transform: scaleY(1); }
        100% { transform: scaleY(0.6); }
      }
      .particle { animation: floatParticle 6s ease-in-out infinite; }
      .p2 { animation-delay: 2s; }
      .p3 { animation-delay: 4s; }
      .glow-orb { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
      .dash-line { stroke-dasharray: 8 6; animation: dashMove 3s linear infinite; }
      .bar { transform-origin: bottom; animation: barGrow 4s ease-in-out infinite; }
      .b2 { animation-delay: 1.5s; }
      .b3 { animation-delay: 2.5s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Orbs & Ambient Graphic Elements in Background -->
  <circle class="glow-orb" cx="200" cy="100" r="180" fill="#4f46e5" opacity="0.25" filter="url(#glow)"/>
  <circle class="glow-orb" cx="1000" cy="300" r="220" fill="#9333ea" opacity="0.2" filter="url(#glow)"/>

  <!-- Background Grid & Dynamic Elements -->
  <g opacity="0.15">
    <line x1="100" y1="0" x2="100" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="400" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic Quota Gauge / Chart Widget (Positioned cleanly on right background) -->
  <g transform="translate(820, 70)">
    <!-- Glass card container -->
    <rect width="320" height="260" rx="16" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" backdrop-filter="blur(10px)"/>
    
    <!-- Title inside card -->
    <text x="24" y="38" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">RESOURCE QUOTA MONITOR</text>
    
    <!-- Animated Chart Bars -->
    <g transform="translate(30, 200)">
      <!-- Bar 1 -->
      <rect class="bar" x="20" y="-120" width="36" height="120" rx="6" fill="url(#bar-grad-1)"/>
      <text x="38" y="-130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">62%</text>
      <text x="38" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">AWS</text>

      <!-- Bar 2 -->
      <rect class="bar b2" x="100" y="-145" width="36" height="145" rx="6" fill="url(#bar-grad-2)"/>
      <text x="118" y="-155" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">78%</text>
      <text x="118" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">GCP</text>

      <!-- Bar 3 (Quota Limit Warning) -->
      <rect class="bar b3" x="180" y="-170" width="36" height="170" rx="6" fill="url(#bar-grad-3)"/>
      <text x="198" y="-180" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">94% ⚠️</text>
      <text x="198" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Azure</text>
    </g>

    <!-- Quota Limit Line -->
    <line class="dash-line" x1="40" y1="85" x2="280" y2="85" stroke="#f43f5e" stroke-width="2"/>
    <text x="275" y="78" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" text-anchor="end" font-weight="bold">HARD LIMIT THRESHOLD</text>
  </g>

  <!-- Floating Floating Tech Badges (Particles) -->
  <g class="particle">
    <rect x="730" y="60" width="75" height="28" rx="14" fill="rgba(129, 140, 248, 0.2)" stroke="#818cf8" stroke-width="1"/>
    <text x="767" y="78" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">AWS API</text>
  </g>

  <g class="particle p2">
    <rect x="750" y="290" width="90" height="28" rx="14" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1"/>
    <text x="795" y="308" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">Kubernetes</text>
  </g>

  <g class="particle p3">
    <rect x="680" y="170" width="110" height="28" rx="14" fill="rgba(192, 132, 252, 0.2)" stroke="#c084fc" stroke-width="1"/>
    <text x="735" y="188" fill="#f0abfc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">Rate Limiting</text>
  </g>

  <!-- Foreground Title and Subtitle Area (Ensured no overlap) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 80)">
      <rect width="260" height="32" rx="16" fill="url(#accent-grad)" opacity="0.25"/>
      <rect width="260" height="32" rx="16" fill="none" stroke="url(#accent-grad)" stroke-width="1.5"/>
      <text x="130" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Primary Title -->
    <text x="0" y="165" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Cloud Quota
    </text>
    <text x="0" y="215" fill="url(#accent-grad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      &amp; Limit Management 📊
    </text>

    <!-- Subtitle -->
    <text x="0" y="265" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17" font-weight="400">
      Enterprise SaaS Platforms, Multi-Cloud Governance &amp; Open-Source Limit Tools
    </text>

    <!-- Key Feature Badges under Subtitle -->
    <g transform="translate(0, 295)">
      <text x="0" y="15" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="500">
        🛡️ Service Quotas &nbsp;&bull;&nbsp; ⚡ Automated Requests &nbsp;&bull;&nbsp; ☸️ K8s ResourceQuotas &nbsp;&bull;&nbsp; 💰 FinOps
      </text>
    </g>
  </g>
</svg>
